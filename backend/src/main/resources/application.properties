spring.application.name=job-platform
server.port=8080
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/jobplatform

# JWT
jwt.secret=job-platform-super-secret-key-2024-minimum-32chars
jwt.expiration=86400000

# CORS
spring.web.cors.allowed-origins=http://localhost:5173

# Resume - now served via GridFS endpoint
app.resume.base-url=http://localhost:8080/api/resume/

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
logging.level.org.springframework.security=DEBUG
server.error.include-message=always
