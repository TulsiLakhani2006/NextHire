spring.application.name=job-platform
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/jobplatform

# JWT
jwt.secret=job-platform-super-secret-key-2024-minimum-32chars
jwt.expiration=86400000

# CORS
spring.web.cors.allowed-origins=http://localhost:5173

# Resume upload
app.resume.upload-dir=uploads/resumes
app.resume.base-url=http://localhost:8080/resumes/

# Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Static files
spring.web.resources.static-locations=classpath:/static/,file:uploads/